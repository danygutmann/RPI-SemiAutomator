services:
  rpi-semiautomator:
    build: .
    image: rpi-semiautomator:latest
    container_name: rpi-semiautomator
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Share device nodes so serial adapters plugged in after startup are
    # visible. The cgroup rules limit access to USB, ACM, and UART serial ports.
    volumes:
      - /dev:/dev
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
      - "c 204:* rmw"
    # The dialout group typically owns serial device nodes on Debian based
    # systems (incl. Raspberry Pi OS); joining it avoids needing --privileged.
    group_add:
      - dialout
    environment:
      - RPI_SEMIAUTOMATOR_CONFIG=/app/config/config.yaml
      - RPI_SEMIAUTOMATOR_FAVORITES=/app/data/favorites.yaml
