# RPI-SemiAutomator configuration
#
# Defines the serial ports that are offered as presets when adding a
# favorite on the Settings page.
#
# Ports are not opened automatically - they are only listed as presets that
# can be selected and connected to from the web UI. Additional ports found
# on the system (e.g. plugged in USB-serial adapters) are also offered as
# presets automatically, even if they are not listed here. Only connections
# that have been saved as a favorite (via the Settings page) are shown on the
# start page.

ports:
  - name: "USB0"
    device: "/dev/ttyUSB0"
    baudrate: 115200
  - name: "USB1"
    device: "/dev/ttyUSB1"
    baudrate: 9600
  - name: "ACM0"
    device: "/dev/ttyACM0"
    baudrate: 115200

# There are no predefined "macro" buttons anymore. Macros are created
# individually from the web UI (per port or globally) and are stored in
# data/macros.yaml.
